name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# A newer push supersedes older runs of the same ref: cancel the in-progress run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide which lanes must run for this PR. Pushes to main and manual dispatches
  # always run every lane.
  # Path sets are intentionally broad: shared compiler / toolchain / workflow changes
  # force all lanes so a latent break still gets caught on main.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      lean: ${{ steps.gate.outputs.lean }}
      evm: ${{ steps.gate.outputs.evm }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - '.github/workflows/ci.yml'
              - '.agents/setup'
              - 'lakefile.lean'
              - 'lean-toolchain'
              - 'lake-manifest.json'
              - 'ProofForge/Cli.lean'
              - 'ProofForge/Attr.lean'
              - 'ProofForge/Extract.lean'
              - 'ProofForge/Extract/**'
              - 'ProofForge/Core/**'
              - 'ProofForge/Crypto/**'
              - 'ProofForge/Profile.lean'
            lean:
              - 'ProofForge/**'
              - 'Tests/**'
              - 'Tests.lean'
              - 'Examples/**'
              - 'Examples.lean'
              - 'scripts/check_*.py'
              - 'lakefile.lean'
              - 'lean-toolchain'
              - 'lake-manifest.json'
              - '.github/workflows/ci.yml'
              - '.agents/setup'
            evm:
              - 'ProofForge/Evm/**'
              - 'Examples/Evm/**'
              - 'runtime-tests/evm/**'
              - 'scripts/check_artifact_manifest.py'
              - 'scripts/ci_pf_init_named_project.sh'
              - 'scripts/deploy_evm.sh'
              - 'lakefile.lean'
              - 'lean-toolchain'
              - 'lake-manifest.json'
              - '.github/workflows/ci.yml'
              - '.agents/setup'
              - 'ProofForge/Cli.lean'
              - 'ProofForge/Extract.lean'
              - 'ProofForge/Extract/**'
              - 'ProofForge/Core/**'
              - 'templates/**'

      - name: Publish lane gates
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SHARED: ${{ steps.filter.outputs.shared }}
          LEAN: ${{ steps.filter.outputs.lean }}
          EVM: ${{ steps.filter.outputs.evm }}
        run: |
          set -euo pipefail
          # main pushes always exercise every lane.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "lean=true" >> "$GITHUB_OUTPUT"
            echo "evm=true" >> "$GITHUB_OUTPUT"
            echo "changes: push event → all lanes"
            exit 0
          fi
          or_shared() {
            local lane="$1"
            if [ "$SHARED" = "true" ] || [ "$lane" = "true" ]; then
              echo "true"
            else
              echo "false"
            fi
          }
          lean="$(or_shared "$LEAN")"
          evm="$(or_shared "$EVM")"
          {
            echo "lean=$lean"
            echo "evm=$evm"
          } >> "$GITHUB_OUTPUT"
          echo "changes: lean=$lean evm=$evm"

  lean:
    name: Lean
    needs: changes
    if: needs.changes.outputs.lean == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - name: Cache toolchains and Lean dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            ~/.foundry
            .lake/packages
          key: toolchains-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', '.agents/setup') }}

      - name: Prepare pinned toolchains
        run: |
          ./.agents/setup
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"

      - name: Restore Lean build products
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Check Runtime / SDK ownership boundaries
        run: python3 scripts/check_ownership.py

      - name: Check SDK import-closure (no Emit/Assemble/Registry)
        run: python3 scripts/check_sdk_import_closure.py

      - name: Check artifact manifest
        run: python3 scripts/check_artifact_manifest.py --self-test

      - name: Check every Anvil gate is run by its suite
        run: python3 scripts/check_anvil_suite.py --self-test && python3 scripts/check_anvil_suite.py

      - name: Check kernel proofs have no placeholders
        run: python3 scripts/check_no_sorry.py

      - name: Check isValidSignatureNow honesty
        run: python3 scripts/check_signature_now_honesty.py

      - name: Check IERC1271 false vs revert honesty
        run: python3 scripts/check_ierc1271_bool_honesty.py

      - name: Check DuplicateId product honesty
        run: python3 scripts/check_product_honesty.py

      - name: Check ERC-20 vesting honesty
        run: python3 scripts/check_vest20_honesty.py

      - name: Check vesting rotation honesty
        run: python3 scripts/check_vest_rotate_honesty.py

      - name: Check vesting cliff honesty
        run: python3 scripts/check_vest_cliff_honesty.py

      - name: Check vesting CREATE ZeroAddress honesty
        run: python3 scripts/check_vest_zero_owner_honesty.py

      - name: Check vesting constructor OwnershipTransferred honesty
        run: python3 scripts/check_vest_ctor_log_honesty.py

      - name: Check vesting OwnableInvalidOwner honesty
        run: python3 scripts/check_vest_invalid_owner_honesty.py

      - name: Check vesting OwnableUnauthorizedAccount honesty
        run: python3 scripts/check_vest_unauthorized_honesty.py

      - name: Check vesting dual-asset wallet honesty
        run: python3 scripts/check_vest_dual_honesty.py

      - name: Check TwoStep/Credits CREATE honesty
        run: python3 scripts/check_twostep_ctor_honesty.py

      - name: Check vesting released() honesty
        run: python3 scripts/check_vest_released_honesty.py

      - name: Check vesting Ownable2Step honesty
        run: python3 scripts/check_vest_ownable2step_honesty.py

      - name: Check VestLink ETH-only named profile honesty
        run: python3 scripts/check_vest_eth_only_honesty.py

      - name: Check Erc20Meta issuer permit honesty
        run: python3 scripts/check_erc20_permit_honesty.py

      - name: Check ERC-3009 receiveWithAuthorization honesty
        run: python3 scripts/check_erc3009_receive_honesty.py

      - name: Check ERC-3009 cancelAuthorization honesty
        run: python3 scripts/check_erc3009_cancel_honesty.py

      - name: Check ERC-3009 authorizationState honesty
        run: python3 scripts/check_erc3009_auth_state_honesty.py

      - name: Check ERC-721 3-arg safeTransferFrom honesty
        run: python3 scripts/check_safe3_honesty.py

      - name: Check ERC-721 enumerable honesty
        run: python3 scripts/check_erc721_enum_honesty.py



      - name: Build Lean libraries
        run: lake build

      - name: Build formalization gate modules
        run: |
          lake build ProofForgeEvmSdk
          lake build Tests.ProofSpec

      - name: Build Lean test suite
        run: lake build Tests

      # Save only from main so PR runs do not evict the toolchain cache.
      - name: Save Lean build products
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}

      - name: Check EVM Yul fragment audit (E-B1)
        run: python3 scripts/check_yul_fragment.py --self-test

      - name: Build powdr-probe (EVM Feature B, fast lane)
        run: ./scripts/build_powdr_probe.sh

  evm:
    name: EVM
    needs: changes
    if: needs.changes.outputs.evm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - name: Cache toolchains and Lean dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            ~/.foundry
            .lake/packages
          key: toolchains-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', '.agents/setup') }}

      - name: Prepare pinned toolchains
        run: |
          ./.agents/setup
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"

      - name: Restore Lean build products
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Build program source modules
        run: lake build Examples

      - name: Build all EVM programs
        run: lake exe pf -- build --out build/evm

      - name: Check EVM artifact manifest
        run: python3 scripts/check_artifact_manifest.py --target evm --out build/evm

      - name: Run Anvil integration suite
        run: runtime-tests/evm/anvil.sh

  # Named user-project build gate: CI types `pf init demo` (a project name, not a
  # temp path), then `lake build` + `lake env pf build` and asserts Counter artifacts.
  # Parallel with `evm` so the Examples compile does not hide a broken init path.
  pf-init-user-project:
    name: pf init demo
    needs: changes
    if: needs.changes.outputs.evm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - name: Cache toolchains and Lean dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            ~/.foundry
            .lake/packages
          key: toolchains-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', '.agents/setup') }}

      - name: Prepare pinned toolchains
        run: |
          ./.agents/setup
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"

      - name: Restore Lean build products
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Build pf CLI
        run: lake build pf

      - name: pf init demo then build user-project artifacts
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/.lake/build/bin:$PATH"
          test -x "$GITHUB_WORKSPACE/.lake/build/bin/pf"
          # Literal user command: pf init <project-name>
          ./scripts/ci_pf_init_named_project.sh

  # Required-check identity. Intentionally-skipped lanes (path filter) count as success;
  # failed or cancelled lanes still fail the merge gate. The evm-yulc lane lives in
  # ci-yulc.yml (weekly / manual) and is not required.

  test:
    if: always()
    needs: [changes, lean, evm, pf-init-user-project]
    runs-on: ubuntu-24.04
    steps:
      - name: Require enabled Lean, EVM, and pf init demo lanes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LEAN_RESULT: ${{ needs.lean.result }}
          EVM_RESULT: ${{ needs.evm.result }}
          PF_INIT_RESULT: ${{ needs.pf-init-user-project.result }}
          LEAN_ENABLED: ${{ needs.changes.outputs.lean }}
          EVM_ENABLED: ${{ needs.changes.outputs.evm }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          require_lane() {
            local name="$1" enabled="$2" result="$3"
            if [ "$enabled" != "true" ]; then
              echo "$name: skipped (paths unchanged)"
              return 0
            fi
            echo "$name: $result"
            test "$result" = success
          }
          require_lane Lean "$LEAN_ENABLED" "$LEAN_RESULT"
          require_lane EVM "$EVM_ENABLED" "$EVM_RESULT"
          require_lane "pf init demo" "$EVM_ENABLED" "$PF_INIT_RESULT"
